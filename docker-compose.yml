version: "3.9"

services:
  # frontend:
  #   build: ./frontend
  #   container_name: cvision-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - VITE_API_URL=http://cvision-backend:5000/api
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - cvision-net

  backend:
    build: ./backend
    container_name: cvision-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cvision-net
    command: sh -c "chmod +x /app/start.sh && /app/start.sh"

  ml-service:
    build: ./ml
    container_name: cvision-ml
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./ml/.env
    networks:
      - cvision-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvision_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvision_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    networks:
      - cvision-net

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - dev_redis:/data
    networks:
      - cvision-net

networks:
  cvision-net:
    driver: bridge

volumes:
  dev_pgdata:
  dev_redis:
